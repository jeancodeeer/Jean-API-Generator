name: syntax
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in serve.sh .devcontainer/*.sh generator/*.sh oracle/setup-vm.sh tests/*.sh; do
            bash -n "$f" && echo "ok $f"
          done
      - name: python compile
        run: python -m py_compile tools/*.py control/*.py
      - name: router tests
        run: python tests/test_router.py
